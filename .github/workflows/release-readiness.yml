name: Release Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-release-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Validate offline signing helper syntax
        run: bash -n scripts/sign-release-local.sh

      - name: Test, assemble unsigned release, and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:lintRelease

      - name: Record dependency graph and unsigned APK checksum
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > release-runtime-dependencies.txt
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$apk"
          sha256sum "$apk" > release-unsigned-checksum.txt
          printf '%s\n' 'The checksum above is for an UNSIGNED validation APK, not a distributable release.'

      - name: Upload dependency inventory and unsigned checksum
        uses: actions/upload-artifact@v4
        with:
          name: cnguard-release-readiness-report
          path: |
            release-runtime-dependencies.txt
            release-unsigned-checksum.txt
          retention-days: 30
