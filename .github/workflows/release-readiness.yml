name: Release Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-release-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Validate offline signing helper syntax
        run: bash -n scripts/sign-release-local.sh

      - name: Validate read-only field preflight in simulated device scenarios
        shell: bash
        run: |
          bash -n scripts/field-device-preflight.sh
          bash -n scripts/test-field-preflight-ci.sh
          bash scripts/test-field-preflight-ci.sh

      - name: Test, assemble unsigned release, and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:lintRelease

      - name: Exercise offline signing with disposable CI-only identity
        shell: bash
        run: bash scripts/test-signing-helper-ci.sh

      - name: Record dependency graph and unsigned APK checksum
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > release-runtime-dependencies.txt
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$apk"
          sha256sum "$apk" > release-unsigned-checksum.txt
          printf '%s\n' 'The checksum above is for an UNSIGNED validation APK, not a distributable release.'

      - name: Validate license, pinned public certificate, and dependency baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE
          grep -q 'GNU GENERAL PUBLIC LICENSE' LICENSE
          test -s THIRD_PARTY_NOTICES.md
          expected='a693c068e91e410424de88fd5ba42c60a04e13a4edd4d271e17e694b1e195cde'
          actual="$(openssl x509 -in release/signing-certificate.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          grep -Fq 'com.github.Flyfish233:spake2-java:1.1.1' release-runtime-dependencies.txt
          grep -Fq 'org.bouncycastle:bcprov-jdk18on:1.86' release-runtime-dependencies.txt
          echo "Approved GPLv3 and public cert pins passed; full transitive audit remains a human gate."

      - name: Create unsigned candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > unsigned-candidate.sha256
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "project_license=GPL-3.0-only"
            echo "public_signing_cert_sha256=a693c068e91e410424de88fd5ba42c60a04e13a4edd4d271e17e694b1e195cde"
            echo "candidate=UNSIGNED_TEST_ONLY_NOT_A_RELEASE"
          } > unsigned-candidate-provenance.txt

      - name: Upload unsigned APK for private offline signing
        uses: actions/upload-artifact@v4
        with:
          name: cnguard-unsigned-candidate
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            unsigned-candidate.sha256
            unsigned-candidate-provenance.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload dependency inventory and unsigned checksum
        uses: actions/upload-artifact@v4
        with:
          name: cnguard-release-readiness-report
          path: |
            release-runtime-dependencies.txt
            release-unsigned-checksum.txt
            unsigned-candidate-provenance.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
            third_party/licenses/
          retention-days: 30
